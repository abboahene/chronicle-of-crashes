name: Suggest an Incident
description: Submit a historical software crash, cloud outage, or cyberattack (1998–2026) with a verified source.
title: "[Incident]: "
labels: ["incident-submission"]
body:
  - type: input
    id: title
    attributes:
      label: Incident Title
      placeholder: e.g., AWS US-East-1 DynamoDB DNS Outage
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date (Year / Month)
      placeholder: e.g., Oct 19–20, 2025
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Incident Type
      options:
        - Software Crash / Outage
        - Cyberattack / Breach
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Root Cause & Impact Summary
      placeholder: Briefly describe what failed, why it happened, and the scale of impact.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Verified Source URL (Postmortem, CVE, or News Report)
      placeholder: https://...
    validations:
      required: true

