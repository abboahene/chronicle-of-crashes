name: Sync Incident Feeds

on:
  schedule:
    - cron: '0 6 1 * *' # 1st of every month at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run sync:all
      - name: Commit updated data feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/cisa-kev.json src/data/hibp-breaches.json src/data/outages.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): monthly sync of CISA KEV, HIBP, and outage feeds"
            git push
          fi

